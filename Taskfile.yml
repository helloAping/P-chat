version: '3'

vars:
  GOPROXY: 'https://goproxy.cn,direct'
  VERSION:
    sh: powershell -NoProfile -Command "(Get-Content VERSION -Raw).Trim()"
  GIT_COMMIT:
    sh: powershell -NoProfile -Command "try { (git rev-parse --short HEAD).Trim() } catch { '' }"

env:
  GOTOOLCHAIN: auto

tasks:
  sync:version:
    desc: 读取 VERSION 文件，同步写入 wails.json + install.ps1
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sync-version.ps1
    silent: false

  build:frontend:
    desc: 编译 Vue 前端 (Vite SPA)，输出到 web/ 并同步到 embed 目录
    deps: [sync:version]
    dir: frontend
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "..\scripts\clean-frontend-output.ps1"
      - cmd: npm install
        ignore_error: true
      - npm run build
      # Sync MUST run after `npm run build` so it picks up the
      # freshly emitted index.html / assets/. Putting it in
      # build:all's `deps:` list is wrong: Task runs sibling deps
      # in parallel by default, so the sync can race ahead of
      # clean-frontend-output.ps1 and copy an empty tree.
      - powershell -NoProfile -ExecutionPolicy Bypass -File "..\scripts\sync-web.ps1"
      - powershell -NoProfile -ExecutionPolicy Bypass -File "..\scripts\sync-browser-ext.ps1" -OutDir cmd\pchat-server
    # Intentionally no `sources:` / `generates:` — we always
    # rebuild. The user's complaint was that the SPA shipped
    # stale assets because the file-mtime check missed a
    # change (e.g. edits in `node_modules`-adjacent files, or
    # build-generated config that we don't list). Forcing a
    # full rebuild on every `build:all` / `build:dev` adds
    # ~10-15s but guarantees the binary embeds the same code
    # the dev server shows. The clean-frontend-output wipe at
    # the top of this task is the other half of the safety
    # net — without it, content-hashed Vite assets from a
    # previous build pile up in the embed and grow the binary.
    silent: false

  sync:web:
    desc: 同步 web/ 到 cmd/pchat-server/web/（embed 需要真实目录）
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sync-web.ps1
    silent: false

  build:
    desc: 编译 CLI 和 Server（包含一次前端构建）
    cmds:
      - task: build:binaries
    deps: [build:frontend]
    silent: false

  build:binaries:
    internal: true
    cmds:
      - go build -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat.exe ./cmd/pchat
      - go build -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-server.exe ./cmd/pchat-server
      - go build -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-updater.exe ./cmd/pchat-updater
      - powershell -NoProfile -Command "Copy-Item -Force cmd\pchat-server\browser-extension.zip bin\browser-extension.zip"
    silent: false

  build:gui:
    desc: 编译桌面端 (Wails v2，包含一次前端构建)
    deps: [build:frontend]
    cmds:
      - task: build:gui:binary
    silent: false

  build:gui:platform:
    desc: 编译指定平台桌面端。用法：task build:gui:platform PLATFORM=win|linux|mac
    vars:
      PLATFORM: '{{default "win" .PLATFORM}}'
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/run-platform-build.ps1" -Task "build:gui:{{.PLATFORM}}" -Platform "{{.PLATFORM}}"
    silent: false

  build:gui:win:
    desc: 编译 Windows 桌面端别名
    cmds:
      - task: build:gui
    silent: false

  build:gui:binary:
    internal: true
    dir: cmd\pchat-gui
    cmds:
      # wails-build.ps1 locates the wails CLI in the standard
      # GOPATH/bin locations and prepends it to $PATH before
      # invoking `wails build`. We keep the wails call out
      # of the Taskfile because the long PowerShell command
      # with embedded ": " characters broke YAML's plain-
      # scalar parser (see scripts/wails-build.ps1 for the
      # full rationale).
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "..\..\scripts\wails-build.ps1" -platform "win" -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}"
        env:
          GOPROXY: '{{.GOPROXY}}'
          GOTOOLCHAIN: auto
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "..\..\scripts\copy-build-artifact.ps1" -Source "build\bin\pchat-gui.exe" -Destination "..\..\bin\pchat-gui.exe"
    silent: false

  build:gui:linux:
    desc: 编译 Linux 桌面端 (Wails v2)
    deps: [build:frontend]
    cmds:
      - task: build:gui:linux:binary
    silent: false

  build:gui:linux:binary:
    dir: cmd\pchat-gui
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "..\..\scripts\wails-build.ps1" -platform "linux" -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}"
        env:
          GOPROXY: '{{.GOPROXY}}'
          GOTOOLCHAIN: auto
    silent: false

  build:gui:macos:
    desc: 编译 macOS 桌面端 (Wails v2) — 需要在 macOS 主机上运行
    deps: [build:frontend]
    cmds:
      - task: build:gui:macos:binary
    silent: false

  build:gui:mac:
    desc: 编译 macOS 桌面端别名
    cmds:
      - task: build:gui:macos
    silent: false

  build:gui:macos:binary:
    dir: cmd\pchat-gui
    cmds:
      # Wails v2 does not support cross-compile to macOS — Apple's
      # toolchain is required. Skip with a clear message on non-macOS
      # hosts so `build:all` doesn't surface a cryptic linker error
      # when run from Windows/Linux CI.
      - cmd: powershell -NoProfile -Command "if (-not [System.Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([System.Runtime.InteropServices.OSPlatform]::OSX)) { Write-Host '[skip] pchat-gui macOS build requires macOS host. Run this on a Mac or in a macOS CI runner.' -ForegroundColor Yellow; exit 0 }"
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "..\..\scripts\wails-build.ps1" -platform "mac" -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}"
        env:
          GOPROXY: '{{.GOPROXY}}'
          GOTOOLCHAIN: auto
    silent: false

  build:server:linux:
    desc: 交叉编译 Linux Server 二进制
    cmds:
      - cmd: go build -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-server-linux ./cmd/pchat-server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
    silent: false

  build:updater:linux:
    desc: 交叉编译 Linux 自动更新器
    cmds:
      - cmd: go build -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-updater-linux ./cmd/pchat-updater
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
    silent: false

  build:im_qq:
    desc: 编译带 QQ IM adapter build tag 的 Server
    cmds:
      - go build -tags im_qq -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-server-im-qq.exe ./cmd/pchat-server
    silent: false

  build:im_wx:
    desc: 编译带 QQ + 微信 IM adapter build tag 的 Server
    cmds:
      - go build -tags "im_qq im_wx" -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-server-im-wx.exe ./cmd/pchat-server
    silent: false

  build:server:macos:
    desc: 交叉编译 macOS Server 二进制 (amd64)
    cmds:
      - cmd: go build -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-server-darwin-amd64 ./cmd/pchat-server
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
    silent: false

  build:updater:macos:
    desc: 交叉编译 macOS 自动更新器 (amd64)
    cmds:
      - cmd: go build -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-updater-darwin-amd64 ./cmd/pchat-updater
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
    silent: false

  build:cli:linux:
    desc: 交叉编译 Linux CLI 二进制
    cmds:
      - cmd: go build -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-linux ./cmd/pchat
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
    silent: false

  build:cli:macos:
    desc: 交叉编译 macOS CLI 二进制 (amd64)
    cmds:
      - cmd: go build -ldflags "-X github.com/p-chat/pchat/internal/version.Version={{.VERSION}} -X github.com/p-chat/pchat/internal/version.GitCommit={{.GIT_COMMIT}}" -o bin/pchat-darwin-amd64 ./cmd/pchat
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
    silent: false

  build:gui:npm:
    desc: 桌面端 — 仅刷新前端依赖（首次构建前需要）
    dir: frontend
    cmds:
      - npm install

  build:setup:
    desc: 构建单文件安装器 bin/pchat-setup-v{version}.exe（依赖 build + build:gui）
    cmds:
      - task: build:win
    generates:
      - bin/pchat-setup-v*.exe
    silent: false

  build:setup:installer:
    internal: true
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer.ps1
    silent: false

  build:windows:artifacts:
    internal: true
    # 前端就绪后并行编译。Compile independent Windows artifacts in parallel after the SPA is ready.
    deps: [build:binaries, build:gui:binary]

  build:win:
    desc: 打包 Windows GUI setup 安装包 + 自动更新增量包
    cmds:
      - task: build:frontend
      - task: build:win:prepared
    silent: false

  build:win:prepared:
    internal: true
    deps: [build:windows:artifacts]
    cmds:
      - task: build:setup:installer
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-update-zip.ps1 -RequireSetup
    silent: false

  build:linux:
    desc: 打包 Linux GUI setup 压缩包 + 自动更新增量包（Windows 下 GUI 二进制 best-effort）
    cmds:
      - task: build:frontend
      - task: build:linux:prepared
    silent: false

  build:linux:prepared:
    internal: true
    deps: [build:server:linux, build:cli:linux, build:updater:linux]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/run-platform-build.ps1" -Task "build:gui:linux:binary" -Platform "linux"
      - powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/package-platform-archive.ps1" -Platform "linux" -AllowMissingGui
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-update-zip.ps1 -Platform "linux" -RequireSetup -AllowMissingGui
    silent: false

  build:mac:
    desc: 打包 macOS GUI setup 压缩包 + 自动更新增量包（Windows 下 GUI .app best-effort）
    cmds:
      - task: build:frontend
      - task: build:mac:prepared
    silent: false

  build:mac:prepared:
    internal: true
    deps: [build:server:macos, build:cli:macos, build:updater:macos]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/run-platform-build.ps1" -RequiredOS mac -Task "build:gui:macos:binary" -Platform "mac"
      - powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/package-platform-archive.ps1" -Platform "mac" -AllowMissingGui
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-update-zip.ps1 -Platform "mac" -RequireSetup -AllowMissingGui
    silent: false

  build:all:
    desc: 同时打包 Windows / macOS / Linux GUI setup 安装包 + 自动更新增量包
    cmds:
      # 前端只构建并同步一次。Build and sync the SPA exactly once.
      # 后续阶段直接消费已有产物。Following stages consume the existing output.
      - task: build:frontend
      - task: build:win:prepared
      - task: build:linux:prepared
      - task: build:mac:prepared

  package:gui:
    desc: 打包 Windows GUI setup 安装包 + 自动更新增量包
    cmds:
      - task: build:win
    silent: false

  package:gui:platform:
    desc: 打包指定平台 setup + 增量包。用法：task package:gui:platform PLATFORM=win|linux|mac
    vars:
      PLATFORM: '{{default "win" .PLATFORM}}'
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/run-platform-build.ps1" -Task "package:gui:{{.PLATFORM}}" -Platform "{{.PLATFORM}}"
    silent: false

  package:gui:win:
    desc: 打包 Windows setup + 增量包别名
    cmds:
      - task: build:win
    silent: false

  package:update:win:
    desc: 打包 Windows setup + 自动更新增量压缩包
    cmds:
      - task: build:win
    silent: false

  package:update:linux:
    desc: 打包 Linux setup + 自动更新增量压缩包
    cmds:
      - task: build:linux
    silent: false

  package:update:macos:
    desc: 打包 macOS setup + 自动更新增量压缩包
    cmds:
      - task: build:mac
    silent: false

  package:update:mac:
    desc: 打包 macOS setup + 自动更新增量压缩包别名
    cmds:
      - task: package:update:macos
    silent: false

  package:update:all:
    desc: 打包 Windows / macOS / Linux setup + 自动更新增量压缩包
    cmds:
      - task: build:all
    silent: false

  package:gui:linux:
    desc: 打包 Linux setup + 增量包别名
    cmds:
      - task: build:linux
    silent: false

  # build:all 在前端就绪后调用的隐藏入口。Hidden entry point used after build:frontend.
  # 平台包装脚本会启动子 Task 进程，因此此任务需保持可调用。
  # The platform wrapper starts a child Task process, so this task stays callable.
  package:gui:linux:prepared:
    deps: [build:server:linux, build:cli:linux, build:updater:linux]
    cmds:
      # Wails v2 does not support Windows→Linux cross-compile. The
      # build step is best-effort: when it fails (or is run on
      # Windows without a CGO+GTK+webkit toolchain) we still ship
      # the rest of the bundle (server + CLI + SPA + scripts). The
      # user can build pchat-gui on a Linux host or via a Linux CI
      # runner and drop it into build/bin/ before installing.
      - task: build:gui:linux:binary
        ignore_error: true
      # The actual assembly lives in a dedicated script. The
      # equivalent inline PowerShell trips on `:` in warning
      # messages (Task's YAML key-value parser interprets
      # "WARNING:" as a mapping key); a script sidesteps YAML
      # quoting entirely.
      - powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/package-gui-linux.ps1"
    silent: false

  package:gui:macos:
    desc: 打包 macOS setup + 增量包别名
    cmds:
      - task: build:mac
    silent: false

  package:gui:mac:
    desc: 打包 macOS setup + 增量包别名
    cmds:
      - task: package:gui:macos
    silent: false

  # build:all 在共享前端构建后调用的隐藏入口。Hidden entry point used after the shared SPA build.
  package:gui:macos:prepared:
    deps: [build:server:macos, build:cli:macos, build:updater:macos]
    cmds:
      # Wails v2 cannot cross-compile to darwin from Windows/Linux.
      # Skip with a clear message on non-macOS hosts; the actual
      # packaging step below runs only on macOS.
      - cmd: powershell -NoProfile -Command "if (-not [System.Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([System.Runtime.InteropServices.OSPlatform]::OSX)) { Write-Host '[skip] pchat-gui macOS package requires macOS host. Run this on a Mac or in a macOS CI runner.' -ForegroundColor Yellow; exit 0 }"
      - task: build:gui:macos:binary
        ignore_error: true
      # Only run the bundle assembly on macOS — the script does
      # `cp` / `chmod` on the .app, server, and CLI, and the .app
      # only exists if build:gui:macos succeeded above. The script
      # itself guards against missing inputs.
      - cmd: bash "scripts/package-gui-macos.sh"
    silent: false

  cli:
    desc: 运行 CLI
    env:
      PCHAT_PROFILE: dev
      PCHAT_DATA_HOME: '{{.ROOT_DIR}}/dev-bin/.p-chat'
      PCHAT_PORT: '0'
    cmds:
      - go run ./cmd/pchat --style tech

  server:
    desc: 运行 HTTP Server
    env:
      PCHAT_PROFILE: dev
      PCHAT_DATA_HOME: '{{.ROOT_DIR}}/dev-bin/.p-chat'
      PCHAT_PORT: '0'
    cmds:
      - go run ./cmd/pchat-server

  gui:
    desc: 启动桌面端 (开发模式)
    dir: cmd\pchat-gui
    env:
      PCHAT_PROFILE: dev
      PCHAT_DATA_HOME: '{{.ROOT_DIR}}/dev-bin/.p-chat'
      PCHAT_PORT: '0'
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "..\..\scripts\wails-dev.ps1" dev
        env:
          GOPROXY: '{{.GOPROXY}}'
          GOTOOLCHAIN: auto

  build:dev:
    desc: 快速编译并启动 GUI 测试环境（绕过 wails dev，前端内嵌到 pchat-server）
    deps: [build:frontend]
    dir: '{{.ROOT_DIR}}'
    env:
      PCHAT_PROFILE: dev
      PCHAT_DATA_HOME: '{{.ROOT_DIR}}/dev-bin/.p-chat'
      PCHAT_PORT: '0'
    cmds:
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Path dev-bin -Force | Out-Null"
      - powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/scripts/stop-dev-processes.ps1"
      - go build -o dev-bin/pchat-server.exe ./cmd/pchat-server
      - go build -o dev-bin/pchat.exe ./cmd/pchat
      - go build -o dev-bin/pchat-updater.exe ./cmd/pchat-updater
      - powershell -NoProfile -Command "Copy-Item -Force cmd\pchat-server\browser-extension.zip dev-bin\browser-extension.zip"
      - task: build:dev:gui
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '.\dev-bin\pchat-gui.exe'"

  build:dev:gui:
    internal: true
    dir: cmd\pchat-gui
    env:
      PCHAT_PROFILE: dev
      PCHAT_DATA_HOME: '{{.ROOT_DIR}}/dev-bin/.p-chat'
      PCHAT_PORT: '0'
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "..\..\scripts\wails-dev.ps1" build-debug
        env:
          GOPROXY: '{{.GOPROXY}}'
          GOTOOLCHAIN: auto
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File "..\..\scripts\copy-build-artifact.ps1" -Source "build\bin\pchat-gui.exe" -Destination "..\..\dev-bin\pchat-gui.exe"

  install:gui:
    desc: 安装桌面端到 %LOCALAPPDATA%\Programs\P-Chat\
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File cmd\pchat-gui\build\bin\install.ps1

  install:gui:linux:
    desc: 安装 Linux 桌面端到 ~/.local/
    cmds:
      - cmd: bash build/bin/install.sh

  uninstall:gui:
    desc: 卸载桌面端
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File cmd\pchat-gui\build\bin\uninstall.ps1

  uninstall:gui:linux:
    desc: 卸载 Linux 桌面端
    cmds:
      - cmd: bash build/bin/uninstall.sh

  install:agents:
    desc: 建立 agent 工具符号链接 (.opencode/.codex/.claude → .agents/AGENTS.md)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ".agents\scripts\install.ps1"

  install:agents:force:
    desc: 重新建立 agent 工具符号链接 (覆盖已有)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ".agents\scripts\install.ps1" -Force

  install:agents:dryrun:
    desc: 预览 install:agents 会做什么 (不实际修改)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ".agents\scripts\install.ps1" -DryRun

  tidy:
    desc: 整理依赖
    cmds:
      - go mod tidy

  fmt:
    desc: 格式化代码
    cmds:
      - gofmt -w .

  vet:
    desc: 静态检查
    cmds:
      - go vet ./...

  test:
    desc: 运行测试
    cmds:
      - go test ./... -v

  test:gui:
    desc: 桌面端单元测试
    dir: cmd\pchat-gui
    cmds:
      - go test -v ./

  test:build:
    desc: 验证聚合构建任务只构建一次前端
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-build-task-graph.ps1

  smoke:gui:
    desc: 桌面端端到端冒烟 (装 -> 启 -> 后端健康 -> 卸)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gui-smoke.ps1

  clean:
    desc: 清理编译产物
    cmds:
      - Remove-Item -Recurse -Force bin -ErrorAction SilentlyContinue
      - Remove-Item -Recurse -Force dev-bin -ErrorAction SilentlyContinue
      - Remove-Item -Recurse -Force cmd\pchat-gui\build\bin -ErrorAction SilentlyContinue
      - Remove-Item -Recurse -Force web\assets -ErrorAction SilentlyContinue

  release:run:
    desc: 本地打 tag 触发 CI Draft Release（交互式，会询问确认）
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/release.ps1"

  release:dryrun:
    desc: 预览 release:run 会做什么（不实际修改）
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/release.ps1" -DryRun

  package:browser-ext:
    desc: 打包浏览器控制扩展为 ZIP (输出到 bin/browser-extension.zip)
