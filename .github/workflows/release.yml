name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: macos-latest
            platform: mac
            arch: arm64
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: auto
      PCHAT_UPDATE_SIGNING_KEY: ${{ secrets.PCHAT_UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Require signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PCHAT_UPDATE_SIGNING_KEY}" ]; then
            echo "PCHAT_UPDATE_SIGNING_KEY is empty. Add the release private key as a repository Actions secret." >&2
            exit 1
          fi

      - name: Check tag matches VERSION
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION v${version}" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Install PowerShell
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci-install-powershell.sh

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci-install-linux-gui-deps.sh

      - name: Install MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build signed packages
        shell: pwsh
        run: ./scripts/ci-release-build.ps1 -Platform ${{ matrix.platform }} -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: pchat-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            bin/pchat-setup-*.exe
            bin/pchat-linux-setup-*.tar.gz
            bin/pchat-linux-setup-*.zip
            bin/pchat-mac-setup-*.tar.gz
            bin/pchat-mac-setup-*.zip
            bin/pchat-update-*.zip
            bin/pchat-latest-*.json
            bin/pchat-release-manifest-*.json
            bin/pchat-server.exe
            bin/pchat-server-linux
            bin/pchat-server-darwin-*

  publish:
    name: Draft Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Install PowerShell
        shell: bash
        run: bash scripts/ci-install-powershell.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: pchat-*
          path: dist
          merge-multiple: true

      - name: Rewrite manifest URLs and validate
        shell: pwsh
        run: |
          ./scripts/rewrite-update-urls.ps1 -Directory dist -UploadBaseUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          ./scripts/validate-release-artifacts.ps1 -Directory dist -RequireSignature -RejectPlaceholder

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists" >&2
            exit 1
          fi
          version="${tag#v}"
          args=(release create "$tag" --draft --title "$tag" --notes "Review the assets, then Publish. Publishing updates the in-app index.")
          if [[ "$version" =~ (alpha|beta|rc) ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release files in dist/" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}"
